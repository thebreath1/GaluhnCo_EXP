<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" fill="none">
  <defs>
    <linearGradient id="cnyBox" x1="120" y1="220" x2="520" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3E1924"/>
      <stop offset="55%" stop-color="#16233B"/>
      <stop offset="100%" stop-color="#0E1523"/>
    </linearGradient>
    <linearGradient id="cnyBrass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0D8A3"/>
      <stop offset="50%" stop-color="#A88B54"/>
      <stop offset="100%" stop-color="#7E6433"/>
    </linearGradient>
    <linearGradient id="cnyIvory" x1="150" y1="180" x2="520" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#EADEC5"/>
    </linearGradient>
  </defs>

  <!-- Lid Behind with Prosperity Emblem -->
  <g transform="rotate(-10 190 220)">
    <rect x="94" y="118" width="226" height="184" rx="14" fill="url(#cnyBox)" stroke="#A88B54" stroke-width="2.5"/>
    <circle cx="207" cy="210" r="46" stroke="url(#cnyBrass)" stroke-width="2.2"/>
    <circle cx="207" cy="210" r="34" stroke="#EAD29E" stroke-opacity="0.6" stroke-width="1.2"/>
    <rect x="195" y="198" width="24" height="24" rx="3" stroke="url(#cnyBrass)" stroke-width="2"/>
  </g>

  <!-- Tray Interior -->
  <polygon points="145,282 392,196 546,256 306,348" fill="url(#cnyIvory)" stroke="#A88B54" stroke-width="2"/>

  <!-- Interior Tea Canisters & Cake Tin -->
  <g transform="translate(205,168)">
    <path d="M10,30 L10,112 A36,12 0 0,0 82,112 L82,30 Z" fill="#6F1D2B" stroke="#A88B54" stroke-width="1.6"/>
    <ellipse cx="46" cy="30" rx="36" ry="11" fill="url(#cnyBrass)"/>
    <rect x="26" y="54" width="40" height="32" rx="4" fill="#FAF7F0" stroke="#A88B54" stroke-width="1.2"/>
  </g>
  <g transform="translate(296,134)">
    <path d="M10,28 L10,122 A36,12 0 0,0 82,122 L82,28 Z" fill="#16233B" stroke="#A88B54" stroke-width="1.6"/>
    <ellipse cx="46" cy="28" rx="36" ry="12" fill="#23375A" stroke="#EAD29E" stroke-width="1.4"/>
    <circle cx="46" cy="76" r="13" fill="url(#cnyBrass)"/>
  </g>
  <g transform="translate(382,186)">
    <path d="M12,28 L12,98 A28,10 0 0,0 68,98 L68,28 Z" fill="#D59A43" fill-opacity="0.9" stroke="#FAF7F0" stroke-width="1.4"/>
    <ellipse cx="40" cy="26" rx="29" ry="9" fill="url(#cnyBrass)"/>
  </g>

  <!-- Box Walls -->
  <polygon points="145,282 306,348 306,496 145,424" fill="url(#cnyBox)" stroke="#A88B54" stroke-width="2"/>
  <polygon points="306,348 546,256 546,404 306,496" fill="#1B2A44" stroke="#A88B54" stroke-width="2"/>

  <!-- Gold Ribbon & Brass Silk Tassel -->
  <polygon points="212,309 238,320 238,465 212,453" fill="url(#cnyBrass)"/>
  <polygon points="416,306 442,296 442,444 416,454" fill="url(#cnyBrass)"/>
  <g transform="translate(306,348)">
    <path d="M0,0 C-46,-34 -72,-2 -28,15 C-12,21 -4,10 0,0 Z" fill="url(#cnyBrass)" stroke="#FAF7F0" stroke-opacity="0.55"/>
    <path d="M0,0 C46,-34 72,-2 28,15 C12,21 4,10 0,0 Z" fill="url(#cnyBrass)" stroke="#FAF7F0" stroke-opacity="0.55"/>
    <circle cx="0" cy="4" r="10" fill="#F0D8A3" stroke="#7E6433" stroke-width="1.2"/>
    <path d="M0,14 L0,36 M-8,46 L0,34 L8,46 L6,72 M-6,72 L-8,46 M0,34 L0,74" stroke="#EAD29E" stroke-width="2" stroke-linecap="round"/>
  </g>

  <rect x="355" y="346" width="146" height="58" rx="8" transform="skewY(-20)" fill="#FAF7F0" stroke="#A88B54" stroke-width="1.6"/>
  <text x="428" y="374" text-anchor="middle" transform="skewY(-20)" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#A88B54">Prosperity Edition</text>
  <text x="428" y="392" text-anchor="middle" transform="skewY(-20)" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#16233B" letter-spacing="1.8">GALUH &amp; CO.</text>
</svg>
