<svg xmlns="http://www.w3.org/2000/svg" width="640" height="580" viewBox="0 0 640 580" fill="none">
  <defs>
    <linearGradient id="ramNavy" x1="120" y1="220" x2="520" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#223659"/>
      <stop offset="55%" stop-color="#16233B"/>
      <stop offset="100%" stop-color="#0C1423"/>
    </linearGradient>
    <linearGradient id="ramIvory" x1="150" y1="180" x2="520" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#EAE0CA"/>
    </linearGradient>
    <linearGradient id="ramBrass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAD29E"/>
      <stop offset="50%" stop-color="#A88B54"/>
      <stop offset="100%" stop-color="#7B6232"/>
    </linearGradient>
    <linearGradient id="amberHoney" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F6DFAC" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#C98A32" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#FAF7F0" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Crescent Dome Silhouette Lid Behind -->
  <g transform="rotate(-11 190 220)">
    <path d="M96,290 L96,170 C96,105 316,105 316,170 L316,290 Z" fill="url(#ramNavy)" stroke="#A88B54" stroke-width="2.5"/>
    <path d="M114,276 L114,174 C114,124 298,124 298,174 L298,276 Z" stroke="#A88B54" stroke-opacity="0.45" stroke-width="1.3"/>
    <!-- Crescent & Star -->
    <path d="M214,158 A24,24 0 1,0 236,194 A19,19 0 1,1 214,158 Z" fill="url(#ramBrass)"/>
    <polygon points="234,166 237,173 244,173 238,177 240,184 234,180 228,184 230,177 224,173 231,173" fill="#EAD29E"/>
  </g>

  <!-- Tray Base -->
  <polygon points="145,282 392,196 546,256 306,348" fill="url(#ramIvory)" stroke="#A88B54" stroke-width="2"/>

  <!-- Interior Ramadan Delicacies -->
  <!-- 1. Nastar Wisman Glass Jar -->
  <g transform="translate(202,168)">
    <path d="M10,32 L10,112 A36,12 0 0,0 82,112 L82,32 Z" fill="url(#amberHoney)" stroke="#FAF7F0" stroke-opacity="0.7" stroke-width="1.5"/>
    <circle cx="34" cy="70" r="10" fill="#E4B15B"/>
    <circle cx="56" cy="68" r="10" fill="#D59A43"/>
    <circle cx="45" cy="88" r="11" fill="#E8B968"/>
    <circle cx="62" cy="92" r="9" fill="#C98D37"/>
    <ellipse cx="46" cy="28" rx="37" ry="11" fill="url(#ramBrass)"/>
    <ellipse cx="46" cy="22" rx="33" ry="8" fill="#EAD29E"/>
  </g>

  <!-- 2. Emerald/Navy Royal Tea Canister -->
  <g transform="translate(292,130)">
    <path d="M10,28 L10,122 A36,12 0 0,0 82,122 L82,28 Z" fill="url(#ramNavy)" stroke="#A88B54" stroke-width="1.6"/>
    <ellipse cx="46" cy="28" rx="36" ry="12" fill="#23375A" stroke="#EAD29E" stroke-width="1.5"/>
    <path d="M26,56 L66,56 L66,96 L26,96 Z" rx="6" fill="#FAF7F0" stroke="#A88B54" stroke-width="1.2"/>
    <circle cx="46" cy="76" r="10" stroke="#16233B" stroke-width="1.4"/>
    <circle cx="46" cy="76" r="4" fill="#A88B54"/>
  </g>

  <!-- 3. Blossom Honey Jar -->
  <g transform="translate(378,186)">
    <path d="M12,30 L12,98 A28,10 0 0,0 68,98 L68,30 Z" fill="url(#amberHoney)" stroke="#FAF7F0" stroke-opacity="0.75" stroke-width="1.4"/>
    <ellipse cx="40" cy="28" rx="29" ry="9" fill="url(#ramBrass)"/>
    <rect x="23" y="54" width="34" height="24" rx="4" fill="#FAF7F0" stroke="#A88B54" stroke-width="1"/>
  </g>

  <!-- Hanging Brass Ketupat Charm on Front Corner -->
  <polygon points="145,282 306,348 306,496 145,424" fill="url(#ramNavy)" stroke="#A88B54" stroke-width="2"/>
  <polygon points="306,348 546,256 546,404 306,496" fill="#1D2E4B" stroke="#A88B54" stroke-width="2"/>

  <!-- Ribbon & Calligraphy Eid Plaque -->
  <polygon points="212,309 238,320 238,465 212,453" fill="url(#ramBrass)"/>
  <polygon points="416,306 442,296 442,444 416,454" fill="url(#ramBrass)"/>

  <g transform="translate(306,348)">
    <path d="M0,0 C-46,-34 -72,-2 -28,15 C-12,21 -4,10 0,0 Z" fill="url(#ramBrass)" stroke="#FAF7F0" stroke-opacity="0.55"/>
    <path d="M0,0 C46,-34 72,-2 28,15 C12,21 4,10 0,0 Z" fill="url(#ramBrass)" stroke="#FAF7F0" stroke-opacity="0.55"/>
    <circle cx="0" cy="4" r="10" fill="#EAD29E" stroke="#7B6232" stroke-width="1.2"/>
    <!-- Ketupat Ornament -->
    <line x1="0" y1="14" x2="0" y2="38" stroke="#EAD29E" stroke-width="1.6"/>
    <polygon points="0,38 18,56 0,74 -18,56" fill="url(#ramBrass)" stroke="#FAF7F0" stroke-width="1.2"/>
    <line x1="-10" y1="48" x2="10" y2="64" stroke="#16233B" stroke-opacity="0.4" stroke-width="1.2"/>
    <line x1="-10" y1="64" x2="10" y2="48" stroke="#16233B" stroke-opacity="0.4" stroke-width="1.2"/>
  </g>

  <rect x="355" y="346" width="146" height="58" rx="8" transform="skewY(-20)" fill="#FAF7F0" stroke="#A88B54" stroke-width="1.6"/>
  <text x="428" y="374" text-anchor="middle" transform="skewY(-20)" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#A88B54">Eid Mubarak</text>
  <text x="428" y="392" text-anchor="middle" transform="skewY(-20)" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#16233B" letter-spacing="1.8">GALUH &amp; CO.</text>
</svg>
