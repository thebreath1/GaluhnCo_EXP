<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" fill="none">
  <defs>
    <linearGradient id="boxNavy" x1="120" y1="220" x2="520" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#223659"/>
      <stop offset="50%" stop-color="#16233B"/>
      <stop offset="100%" stop-color="#0E1729"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="420" y1="260" x2="545" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E2F4D"/>
      <stop offset="100%" stop-color="#0D1524"/>
    </linearGradient>
    <linearGradient id="ivoryTray" x1="150" y1="180" x2="490" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#E8DEC8"/>
    </linearGradient>
    <linearGradient id="brassFoil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DFC48E"/>
      <stop offset="50%" stop-color="#A88B54"/>
      <stop offset="100%" stop-color="#7E6536"/>
    </linearGradient>
    <linearGradient id="glassJar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FAF7F0" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#D9A85B" stop-opacity="0.72"/>
      <stop offset="70%" stop-color="#A66B28" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#FAF7F0" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="teaTin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#263B61"/>
      <stop offset="45%" stop-color="#16233B"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
  </defs>

  <!-- Tilted Luxury Lid Resting Behind -->
  <g transform="rotate(-12 185 215)">
    <rect x="92" y="110" width="230" height="190" rx="14" fill="url(#boxNavy)" stroke="#A88B54" stroke-width="2.5"/>
    <rect x="108" y="126" width="198" height="158" rx="8" stroke="#A88B54" stroke-opacity="0.45" stroke-width="1.2"/>
    <rect x="92" y="192" width="230" height="22" fill="url(#brassFoil)"/>
    <circle cx="207" cy="203" r="18" fill="url(#brassFoil)" stroke="#F2EBDC" stroke-width="1.2"/>
    <text x="207" y="208" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#16233B">G&amp;C</text>
  </g>

  <!-- Box Back Rim & Ivory Cushion -->
  <polygon points="145,280 390,195 545,255 305,345" fill="url(#ivoryTray)" stroke="#A88B54" stroke-width="2"/>
  <polygon points="155,283 388,203 533,257 303,340" fill="#101A2E" fill-opacity="0.22"/>

  <!-- Interior Parcel Items -->
  <!-- 1. Artisanal Tea Tin -->
  <g transform="translate(275,135)">
    <ellipse cx="44" cy="116" rx="34" ry="12" fill="#0B1220" opacity="0.35"/>
    <path d="M10,28 L10,112 A34,12 0 0,0 78,112 L78,28 Z" fill="url(#teaTin)" stroke="#A88B54" stroke-width="1.4"/>
    <ellipse cx="44" cy="28" rx="34" ry="12" fill="#23375A" stroke="#DFC48E" stroke-width="1.4"/>
    <rect x="20" y="54" width="48" height="34" rx="4" fill="#FAF7F0" stroke="#A88B54" stroke-width="1"/>
    <line x1="27" y1="68" x2="61" y2="68" stroke="#16233B" stroke-width="1.8"/>
    <line x1="33" y1="76" x2="55" y2="76" stroke="#A88B54" stroke-width="1.4"/>
  </g>

  <!-- 2. Artisanal Cookie Jar -->
  <g transform="translate(198,175)">
    <path d="M10,30 L10,104 A36,12 0 0,0 82,104 L82,30 Z" fill="url(#glassJar)" stroke="#FAF7F0" stroke-opacity="0.65" stroke-width="1.5"/>
    <circle cx="34" cy="74" r="10" fill="#C99245"/>
    <circle cx="56" cy="70" r="11" fill="#D49F53"/>
    <circle cx="46" cy="88" r="10" fill="#B9823A"/>
    <ellipse cx="46" cy="26" rx="37" ry="11" fill="url(#brassFoil)" stroke="#FAF7F0" stroke-opacity="0.5" stroke-width="1"/>
    <ellipse cx="46" cy="21" rx="34" ry="9" fill="#DFC48E"/>
  </g>

  <!-- 3. Honey Bottle & Wax-Sealed Ceramic Candle -->
  <g transform="translate(362,188)">
    <path d="M12,32 L12,96 A30,10 0 0,0 72,96 L72,32 Z" fill="#FAF7F0" stroke="#A88B54" stroke-width="1.6"/>
    <ellipse cx="42" cy="32" rx="30" ry="10" fill="#E8DEC8" stroke="#A88B54" stroke-width="1.3"/>
    <path d="M42,14 Q47,22 42,27 Q37,22 42,14 Z" fill="#DFC48E"/>
    <rect x="24" y="54" width="36" height="24" rx="4" fill="#16233B"/>
    <circle cx="42" cy="66" r="6" fill="url(#brassFoil)"/>
  </g>

  <!-- Greeting Card with Wax Seal -->
  <g transform="rotate(9 310 295)">
    <rect x="255" y="238" width="96" height="66" rx="6" fill="#FAF7F0" stroke="#A88B54" stroke-width="1.5"/>
    <line x1="272" y1="260" x2="334" y2="260" stroke="#16233B" stroke-opacity="0.55" stroke-width="1.6"/>
    <line x1="278" y1="272" x2="328" y2="272" stroke="#6E675D" stroke-opacity="0.45" stroke-width="1.2"/>
    <circle cx="303" cy="291" r="11" fill="url(#brassFoil)" stroke="#7E6536" stroke-width="1"/>
  </g>

  <!-- Rigid Gift Box Front & Right Faces -->
  <polygon points="145,280 305,345 305,492 145,422" fill="url(#boxNavy)" stroke="#A88B54" stroke-width="2"/>
  <polygon points="305,345 545,255 545,400 305,492" fill="url(#boxSide)" stroke="#A88B54" stroke-width="2"/>

  <!-- Brass Ribbon Wrap & Double Satin Bow -->
  <polygon points="214,308 240,319 240,464 214,452" fill="url(#brassFoil)"/>
  <polygon points="414,304 440,294 440,440 414,450" fill="url(#brassFoil)"/>
  <g transform="translate(305,345)">
    <path d="M0,0 C-48,-36 -74,-4 -30,14 C-14,20 -4,10 0,0 Z" fill="url(#brassFoil)" stroke="#F2EBDC" stroke-opacity="0.55" stroke-width="1"/>
    <path d="M0,0 C48,-36 74,-4 30,14 C14,20 4,10 0,0 Z" fill="url(#brassFoil)" stroke="#F2EBDC" stroke-opacity="0.55" stroke-width="1"/>
    <path d="M-4,8 L-28,68 L-12,62 L0,14 Z" fill="url(#brassFoil)"/>
    <path d="M4,8 L28,68 L12,62 L0,14 Z" fill="url(#brassFoil)"/>
    <circle cx="0" cy="4" r="10" fill="#DFC48E" stroke="#7E6536" stroke-width="1.2"/>
  </g>

  <!-- Monogram Plaque -->
  <rect x="355" y="348" width="142" height="58" rx="8" transform="skewY(-20)" fill="#FAF7F0" fill-opacity="0.95" stroke="#A88B54" stroke-width="1.5"/>
  <text x="426" y="382" text-anchor="middle" transform="skewY(-20)" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#16233B" letter-spacing="2">GALUH &amp; CO.</text>
</svg>
