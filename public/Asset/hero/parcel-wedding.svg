<svg xmlns="http://www.w3.org/2000/svg" width="640" height="580" viewBox="0 0 640 580" fill="none">
  <defs>
    <linearGradient id="wedIvoryFront" x1="120" y1="260" x2="320" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#E4DAC3"/>
    </linearGradient>
    <linearGradient id="wedIvorySide" x1="306" y1="260" x2="546" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F2EBDC"/>
      <stop offset="100%" stop-color="#D7CCB3"/>
    </linearGradient>
    <linearGradient id="wedBrass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAD29E"/>
      <stop offset="50%" stop-color="#A88B54"/>
      <stop offset="100%" stop-color="#7D6333"/>
    </linearGradient>
  </defs>

  <!-- Linen Keepsake Lid Behind -->
  <g transform="rotate(-11 190 220)">
    <rect x="94" y="116" width="226" height="186" rx="14" fill="url(#wedIvoryFront)" stroke="#A88B54" stroke-width="2.5"/>
    <rect x="112" y="134" width="190" height="150" rx="8" stroke="#A88B54" stroke-opacity="0.45" stroke-width="1.2"/>
    <circle cx="207" cy="209" r="32" fill="#16233B" stroke="#A88B54" stroke-width="1.8"/>
    <text x="207" y="214" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#FAF7F0">Forever</text>
  </g>

  <!-- Tray Interior -->
  <polygon points="145,282 392,196 546,256 306,348" fill="#1E2F4D" stroke="#A88B54" stroke-width="2"/>

  <!-- Wedding Keepsake Items -->
  <g transform="translate(208,170)">
    <path d="M12,30 L12,106 A34,11 0 0,0 80,106 L80,30 Z" fill="#FAF7F0" stroke="#A88B54" stroke-width="1.6"/>
    <ellipse cx="46" cy="30" rx="34" ry="11" fill="url(#wedBrass)"/>
    <circle cx="46" cy="68" r="12" fill="#16233B"/>
  </g>
  <g transform="translate(298,140)">
    <path d="M10,28 L10,118 A36,12 0 0,0 82,118 L82,28 Z" fill="#16233B" stroke="#A88B54" stroke-width="1.6"/>
    <ellipse cx="46" cy="28" rx="36" ry="12" fill="#23375A" stroke="#EAD29E" stroke-width="1.4"/>
    <rect x="26" y="54" width="40" height="32" rx="4" fill="#FAF7F0" stroke="#A88B54" stroke-width="1"/>
  </g>
  <g transform="translate(384,186)">
    <path d="M12,30 L12,96 A28,10 0 0,0 68,96 L68,30 Z" fill="#DFC48E" fill-opacity="0.88" stroke="#FAF7F0" stroke-width="1.5"/>
    <ellipse cx="40" cy="28" rx="29" ry="9" fill="url(#wedBrass)"/>
  </g>

  <!-- Ivory Linen Front & Side -->
  <polygon points="145,282 306,348 306,496 145,424" fill="url(#wedIvoryFront)" stroke="#A88B54" stroke-width="2"/>
  <polygon points="306,348 546,256 546,404 306,496" fill="url(#wedIvorySide)" stroke="#A88B54" stroke-width="2"/>

  <!-- Champagne Brass Ribbon & Wax Seal -->
  <polygon points="212,309 238,320 238,465 212,453" fill="url(#wedBrass)"/>
  <polygon points="416,306 442,296 442,444 416,454" fill="url(#wedBrass)"/>
  <g transform="translate(306,348)">
    <path d="M0,0 C-46,-34 -72,-2 -28,15 C-12,21 -4,10 0,0 Z" fill="url(#wedBrass)" stroke="#FAF7F0" stroke-opacity="0.6"/>
    <path d="M0,0 C46,-34 72,-2 28,15 C12,21 4,10 0,0 Z" fill="url(#wedBrass)" stroke="#FAF7F0" stroke-opacity="0.6"/>
    <circle cx="0" cy="4" r="11" fill="#16233B" stroke="#A88B54" stroke-width="1.5"/>
  </g>

  <rect x="355" y="346" width="146" height="58" rx="8" transform="skewY(-20)" fill="#16233B" stroke="#A88B54" stroke-width="1.6"/>
  <text x="428" y="374" text-anchor="middle" transform="skewY(-20)" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#A88B54">Bespoke Keepsake</text>
  <text x="428" y="392" text-anchor="middle" transform="skewY(-20)" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#FAF7F0" letter-spacing="1.8">GALUH &amp; CO.</text>
</svg>
